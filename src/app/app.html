<header class="topbar">
  <a class="brand" routerLink="/">Sporify</a>
  @if (auth.loggedIn()) {
    <div class="actions">
      <span class="user">{{ auth.displayName() }}</span>
      <button type="button" (click)="auth.logout()">Cerrar sesión</button>
    </div>
  }
</header>
<main>
  <router-outlet />
</main>
