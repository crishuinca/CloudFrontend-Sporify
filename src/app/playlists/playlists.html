<section class="page">
  <h1>Playlists</h1>
  <form class="create" (ngSubmit)="create()">
    <input name="name" [(ngModel)]="name" placeholder="Nombre de la playlist" />
    <button type="submit">Crear</button>
  </form>

  @if (error()) {
    <p class="error">{{ error() }}</p>
  }

  <ul class="list">
    @for (playlist of items(); track playlist.id) {
      <li>
        <a [routerLink]="playlist.type === 'LIKES' ? '/likes' : ['/playlists', playlist.id]">
          <strong>{{ playlist.name }}</strong>
          <span>{{ playlist.type === 'LIKES' ? 'Me gusta' : 'Personal' }}</span>
        </a>
      </li>
    } @empty {
      <li class="muted">Aun no hay playlists.</li>
    }
  </ul>
</section>
